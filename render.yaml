# ---------------------------------------------------------------------------
# GRID-X on Render — API (NestJS) + Web (Next.js) + managed PostgreSQL.
#
# Deploy with a Blueprint: Render dashboard → New → Blueprint → pick this repo.
# Secrets marked `sync: false` must be filled in the Render dashboard; nothing
# secret is committed here. See docs/deployment-render.md for the full runbook.
# ---------------------------------------------------------------------------

databases:
  # The region MUST match the services below. Render's internal hostnames
  # (dpg-xxxx-a) only resolve inside a single region's private network, so a
  # Singapore service cannot reach an Oregon database — Prisma fails with
  # "P1001: Can't reach database server". Omitting this key defaults to Oregon.
  - name: gridx-postgres
    databaseName: gridx
    user: gridx
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    # Empty allow list = no external connections; only the private network.
    ipAllowList: []

services:
  # -------------------------------------------------------------------------
  # GRID-X API — NestJS REST API, Swagger at /api/docs, health at /api/health
  # -------------------------------------------------------------------------
  - type: web
    name: gridx-api
    runtime: node
    plan: starter
    region: singapore
    branch: main
    healthCheckPath: /api/health
    # We install pnpm with npm instead of `corepack enable`: the corepack
    # bundled with Node 20.x ships an outdated signing key and dies with
    # "Cannot find matching keyid" when it resolves a pnpm version.
    #
    # --prod=false is required: NODE_ENV=production below applies to the build
    # too, and pnpm reads it as --prod, which skips every devDependency. That
    # drops typescript, @nestjs/cli, tailwindcss and postcss, so the compilers
    # fall through to whatever happens to be on the image PATH.
    buildCommand: >-
      npm install -g pnpm@$PNPM_VERSION &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @gridx/shared build &&
      pnpm --filter @gridx/db build:ci &&
      pnpm --filter @gridx/api build
    preDeployCommand: >-
      pnpm --filter @gridx/db deploy:ci &&
      if [ "$RUN_SEED" = "true" ];
      then echo "--- RUN_SEED=true, seeding database ---";
      pnpm --filter @gridx/db seed:ci;
      else echo "--- RUN_SEED is not true, skipping seed ---";
      fi
    startCommand: pnpm --filter @gridx/api start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: PNPM_VERSION
        value: "9.15.9"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gridx-postgres
          property: connectionString
      - key: API_GLOBAL_PREFIX
        value: api
      # Set RUN_SEED=true and redeploy to load demo data, then set it back to
      # false. The seed upserts, so it is safe to repeat — but it also rewrites
      # every passwordHash, so leaving it on would reset passwords each deploy.
      - key: RUN_SEED
        value: "false"
      # Password for every seeded account. Read when the seed runs, so changing
      # it later has no effect until you seed again.
      - key: SEED_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: gridx-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEB_APP_URL
        fromService:
          type: web
          name: gridx-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: SESSION_IDLE_TIMEOUT_MINUTES
        value: "60"
      - key: OTP_TTL_MINUTES
        value: "10"
      # Object storage: switch STORAGE_DRIVER to s3 and fill the S3_* values with
      # an S3-compatible bucket (AWS S3, Cloudflare R2, Supabase Storage, GCS).
      # Render disks are not shared across instances, so `local` is dev-only.
      - key: STORAGE_DRIVER
        value: s3
      - key: STORAGE_SIGNED_URL_TTL_SECONDS
        value: "300"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: ap-south-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: NOTIFY_EMAIL_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: GRID-X <no-reply@oswar.example>
      - key: NOTIFY_WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_API_URL
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      # IMS boundary — GRID-X consumes masters from IMS and pushes back status.
      #
      # Everything non-secret is set here. Only IMS_DATABASE_URL and IMS_ORG_ID
      # (both sync: false) need filling in the Render dashboard; until they are,
      # the driver reports "not configured" and does nothing — it cannot half-work.
      - key: IMS_ENABLED
        value: "true"
      # Explicit rather than "auto": reads go over the database link because the
      # IMS REST API has no "since" filter and no paging.
      - key: IMS_DRIVER
        value: database
      - key: IMS_DATABASE_URL
        sync: false
      # The IMS is multi-tenant. Without this the database driver refuses to read,
      # rather than pulling every organisation's materials into GRID-X.
      - key: IMS_ORG_ID
        sync: false
      # The OSWAR IMS lives in the "ims" schema, not public — that belongs to the
      # CRM on the same Supabase database.
      - key: IMS_DATABASE_SCHEMA
        value: ims
      - key: IMS_DB_POOL_MAX
        value: "5"
      - key: IMS_DB_STATEMENT_TIMEOUT_MS
        value: "15000"
      # Managed Postgres providers hand out certificates Node will not verify.
      - key: IMS_DB_SSL
        value: no-verify
      - key: IMS_MAPPING_PROFILE
        value: oswar
      # Per-entity overrides as inline JSON — a mounted file is awkward on Render.
      - key: IMS_MAPPING_JSON
        sync: false
      # "none" until the outbox exists: it lives in the IMS database and its
      # creation needs CREATE on that database, which the least-privilege
      # read-only role in docs/13 deliberately does not have. Facts are still
      # recorded in the GRID-X sync log meanwhile. Switch to "outbox" once a DBA
      # has run packages/db/prisma/ims/001_gridx_outbox.sql (pnpm ims:outbox).
      - key: IMS_WRITE_MODE
        value: none
      - key: IMS_OUTBOX_SCHEMA
        value: gridx
      - key: IMS_OUTBOX_TABLE
        value: ims_outbound_fact
      - key: IMS_OUTBOX_AUTO_CREATE
        value: "true"
      - key: IMS_SYNC_INBOUND_ENABLED
        value: "true"
      # The OSWAR IMS publishes no product master, so there is nothing to sweep.
      - key: IMS_SYNC_ENTITIES
        value: companies,items
      - key: IMS_SYNC_BATCH_SIZE
        value: "500"
      # REST transport. The IMS issues no API keys — a dedicated ADMIN login is the
      # only way in. Used for writes when IMS_WRITE_MODE=http.
      - key: IMS_BASE_URL
        sync: false
      - key: IMS_AUTH_EMAIL
        sync: false
      - key: IMS_AUTH_PASSWORD
        sync: false
      - key: IMS_API_KEY
        sync: false
      - key: IMS_TIMEOUT_MS
        value: "15000"
      # Off by default: the IMS accepts no idempotency key on a stock post, so a
      # retry after a lost response would issue the same material twice.
      - key: IMS_HTTP_POST_STOCK
        value: "false"
      - key: IMS_ISSUE_WAREHOUSE_ID
        sync: false
      - key: SENTRY_DSN
        sync: false

  # -------------------------------------------------------------------------
  # GRID-X Web — marketing site, Control, Partner PWA and Inspector
  # -------------------------------------------------------------------------
  - type: web
    name: gridx-web
    runtime: node
    plan: starter
    region: singapore
    branch: main
    healthCheckPath: /
    # Same corepack and --prod=false workarounds as the API service.
    buildCommand: >-
      npm install -g pnpm@$PNPM_VERSION &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @gridx/shared build &&
      pnpm --filter @gridx/web build
    startCommand: pnpm --filter @gridx/web start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: PNPM_VERSION
        value: "9.15.9"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: GRID-X
      # Points at the API service root. The web app appends /api itself, so
      # Render can wire this automatically from the API service URL.
      - key: API_URL
        fromService:
          type: web
          name: gridx-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: gridx-api
          envVarKey: RENDER_EXTERNAL_URL
