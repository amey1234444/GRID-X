name: Mobile APK

# Builds an installable APK of the GRID-X field app (Inspector + Partner) and
# attaches it to the run as an artifact. Run it from the Actions tab and pass the
# API URL the app should talk to; recipients can still change the server address
# from Profile inside the app, so a build without an URL is also usable.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API base URL baked into the build (e.g. https://api.example.com/api)'
        required: false
        default: ''
      variant:
        description: 'Gradle variant'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'mobile-v*'

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # apps/mobile is deliberately outside the pnpm workspace: Metro resolves
      # symlinked hoisted dependencies unreliably, so it keeps its own npm tree.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Generates the native android/ project from app.json. It is not checked
      # in, so every build starts from the declared Expo config.
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}

      - name: Build APK
        run: ./gradlew assemble${{ inputs.variant == 'debug' && 'Debug' || 'Release' }} --no-daemon
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}

      - name: Collect APK
        run: |
          mkdir -p ../../dist
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} ../../dist/gridx-field.apk \;
          ls -lh ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: gridx-field-apk
          path: dist/gridx-field.apk
          if-no-files-found: error
          retention-days: 30
